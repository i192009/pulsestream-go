name: verify
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/...
      - uses: bufbuild/buf-action@v1
        with: {setup_only: true, version: '1.75.0'}
      - run: buf lint && buf generate && git diff --exit-code api/gen
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run build && npm test && npm audit --audit-level=high
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tasks.py up
      - run: python3 scripts/tasks.py test-integration
      - run: python3 scripts/tasks.py e2e --count 1000
      - run: python3 scripts/failure_test.py
      - if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: integration-evidence, path: 'compose.log'}
      - if: always()
        run: docker compose down
  testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: PULSE_TESTCONTAINERS=1 go test -v ./tests/integration -run TestRedisContainerQuotaTTL
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with: {version: 'v3.19.0'}
      - run: helm lint deployments/helm/pulsestream && helm template pulse deployments/helm/pulsestream > /tmp/pulse.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:latest
        with: {entrypoint: /kubeconform, args: '-strict -summary /github/workspace/deployments/kubernetes/dependencies.yaml'}
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: 'pulsestream-go:ci', cache-from: 'type=gha', cache-to: 'type=gha,mode=max'}
      - uses: docker/build-push-action@v6
        with: {context: web, push: false, tags: 'pulsestream-dashboard:ci'}
