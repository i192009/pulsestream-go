{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports: [{port: 8080}, {port: 9090}]
  egress:
    - to:
        - namespaceSelector: {}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector: {}
      ports: [{port: 9092}, {port: 5432}, {port: 8123}, {port: 6379}, {port: 4318}, {port: 8080}]
{{- end }}
