{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "resources": {
      "requests": {
        "storage": "5Gi"
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "postgres"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "postgres",
          "pulsestream-dependency": "true"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "postgres",
            "image": "postgres:17-alpine",
            "ports": [
              {
                "containerPort": 5432
              }
            ],
            "env": [
              {
                "name": "POSTGRES_USER",
                "value": "pulse"
              },
              {
                "name": "POSTGRES_PASSWORD",
                "value": "pulse-dev"
              },
              {
                "name": "POSTGRES_DB",
                "value": "pulse"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "2",
                "memory": "1Gi"
              }
            },
            "readinessProbe": {
              "tcpSocket": {
                "port": 5432
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 5
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/postgresql/data"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "postgres"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "postgres"
  },
  "spec": {
    "selector": {
      "app": "postgres"
    },
    "ports": [
      {
        "port": 5432,
        "targetPort": 5432
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "redis"
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "redis"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "redis",
          "pulsestream-dependency": "true"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "redis",
            "image": "redis:8-alpine",
            "ports": [
              {
                "containerPort": 6379
              }
            ],
            "env": [],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "2",
                "memory": "1Gi"
              }
            },
            "readinessProbe": {
              "tcpSocket": {
                "port": 6379
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 5
            },
            "args": [
              "redis-server",
              "--maxmemory",
              "64mb",
              "--maxmemory-policy",
              "noeviction"
            ]
          }
        ]
      }
    }
  }
}
