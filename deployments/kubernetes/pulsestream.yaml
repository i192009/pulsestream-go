# Source: pulsestream/templates/dashboard.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-dashboard
spec:
  replicas: 1
  selector:
    matchLabels: {app: pulse-dashboard}
  template:
    metadata:
      labels: {app: pulse-dashboard, app.kubernetes.io/part-of: pulse}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101}
      containers:
        - name: dashboard
          image: pulsestream-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap: {name: pulse-nginx}
---
# Source: pulsestream/templates/services.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-alert-service
  labels: {app.kubernetes.io/part-of: pulse, app.kubernetes.io/name: alert-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pulse-alert-service}
  template:
    metadata:
      labels: {app: pulse-alert-service, app.kubernetes.io/part-of: pulse, app.kubernetes.io/name: alert-service}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alert-service
          image: pulsestream-go:dev
          imagePullPolicy: IfNotPresent
          args: [alert-service]
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: pulse-config}
            - secretRef: {name: pulsestream-secrets}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            limits:
              cpu: "2"
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 5
---
