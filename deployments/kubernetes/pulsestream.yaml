---
# Source: pulsestream/templates/network.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: pulse}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports: [{port: 8080}, {port: 9090}]
  egress:
    - to:
        - namespaceSelector: {}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector: {}
      ports: [{port: 9092}, {port: 5432}, {port: 8123}, {port: 6379}, {port: 4318}, {port: 8080}]
---
# Source: pulsestream/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-config
data:
  PULSE_BROKERS: "redpanda:9092"
  PULSE_CLICKHOUSE: "http://clickhouse:8123"
  PULSE_GROUP: "pulsestream-v1"
  PULSE_ORIGIN: "http://localhost:13000"
  PULSE_PARTITIONS: "8"
  PULSE_RATE: "10000"
  PULSE_REDIS: "redis:6379"
---
# Source: pulsestream/templates/dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-nginx
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / { try_files $uri $uri/ /index.html; }
      location /v1/ { proxy_pass http://pulse-analytics-api:8080; }
      location /ws {
        proxy_pass http://pulse-websocket-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
      }
    }
---
# Source: pulsestream/templates/dashboard.yaml
apiVersion: v1
kind: Service
metadata:
  name: pulse-dashboard
spec:
  selector: {app: pulse-dashboard}
  ports: [{name: http, port: 8080, targetPort: http}]
---
