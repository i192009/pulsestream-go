apiVersion: batch/v1
kind: Job
metadata:
  name: pulse-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: init
          image: pulsestream-go:dev
          args: [init]
          envFrom:
            - configMapRef: {name: pulse-config}
            - secretRef: {name: pulsestream-secrets}
          resources:
            limits:
