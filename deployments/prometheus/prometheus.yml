global:
  scrape_interval: 5s
scrape_configs:
  - job_name: pulse
    static_configs:
      - targets: ['ingestion-gateway:8080', 'stream-processor:8080', 'sink-dispatcher:8080', 'analytics-api:8080', 'alert-service:8080', 'websocket-gateway:8080']
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ['redpanda:9644']
