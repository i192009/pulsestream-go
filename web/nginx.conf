server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $analytics http://analytics-api:8080;
 set $websocket http://websocket-gateway:8080;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; frame-ancestors 'none'" always;
 location / { try_files $uri $uri/ /index.html; }
 location /v1/ { proxy_pass $analytics$request_uri; proxy_read_timeout 40s; }
 location /ws { proxy_pass $websocket$request_uri; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 60s; }
}
